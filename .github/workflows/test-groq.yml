name: Diagnose Groq API access

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to test"
        required: true
        type: choice
        default: "openai/gpt-oss-20b"
        options:
          - "openai/gpt-oss-20b"
          - "openai/gpt-oss-120b"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check Groq model access without using DevFun matches
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ github.event.inputs.model || 'openai/gpt-oss-20b' }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ.get("GROQ_API_KEY", "").strip()
          model = os.environ.get("GROQ_MODEL", "openai/gpt-oss-20b")
          if not key:
              print("DIAGNOSIS: GROQ_API_KEY secret is missing or empty for this repository/workflow.")
              raise SystemExit(2)

          print(json.dumps({"secretPresent": True, "modelToTest": model}))
          def call(label, url, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              headers = {
                  "Authorization": "Bearer " + key,
                  "Accept": "application/json"
              }
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              status, raw, response_headers = None, b"", {}
              try:
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      status = resp.status
                      raw = resp.read(3000)
                      response_headers = dict(resp.headers.items())
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  raw = exc.read(3000)
                  response_headers = dict(exc.headers.items()) if exc.headers else {}
              except Exception as exc:
                  print(label + ":", json.dumps({"status": None, "exception": type(exc).__name__}))
                  return None

              text = raw.decode("utf-8", "replace")
              text = text.replace(key, "[REDACTED]")
              try:
                  parsed = json.loads(text) if text else None
              except Exception:
                  parsed = text[:1200]
              # Only emit non-secret diagnostic headers; never dump request headers or credentials.
              safe_headers = {}
              for name in ("x-request-id", "x-groq-request-id", "retry-after", "content-type"):
                  value = next((v for k, v in response_headers.items() if k.lower() == name), None)
                  if value is not None:
                      safe_headers[name] = str(value)[:200]
              print(label + ":", json.dumps({"status": status, "headers": safe_headers, "body": parsed}, ensure_ascii=False))
              return status

          models_status = call("MODELS_ENDPOINT", "https://api.groq.com/openai/v1/models")
          chat_status = call(
              "CHAT_COMPLETIONS_TEST",
              "https://api.groq.com/openai/v1/chat/completions",
              method="POST",
              body={
                  "model": model,
                  "messages": [
                      {"role": "user", "content": "Reply with the single word OK."}
                  ],
                  "max_completion_tokens": 16,
                  "reasoning_effort": "low"
              }
          )
          if chat_status == 200:
              print("DIAGNOSIS: Chat completion succeeded; the configured model can be used. The chat test is the decisive check for the bot.")
              if models_status != 200:
                  print("NOTE: The models-list endpoint did not return 200, but chat completion works; this alone does not block bot decisions.")
          elif chat_status in (401, 403):
              print("DIAGNOSIS: The chat-completions request is blocked. Use its sanitized status/body above to distinguish key authentication from model/project permissions.")
              raise SystemExit(1)
          else:
              print("DIAGNOSIS: Chat completion did not succeed; inspect its status and sanitized response body above.")
              raise SystemExit(1)
          PY
