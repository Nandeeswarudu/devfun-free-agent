name: Inspect DevFun TCG strategy decisions

on:
  push:
    paths:
      - ".inspect-tcg-trigger"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Summarize Nandu AI decisions in settled practice match
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          BASE="https://arena.dev.fun/api/arena"
          MID="2950b773-c8c9-412d-9336-63ffbeb917a4"
          OUR="cmvnnuyg8b7w6m200udq70qbj"
          def get(path):
              req=urllib.request.Request(BASE+path,headers={"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          battle=get("/tcg/battle/"+MID)
          decisions=get("/tcg/battle/"+MID+"/decisions")
          actions={a.get("seq"):a for a in battle.get("actions",[]) if a.get("agentId")==OUR}
          points=[]
          for p in decisions.get("decisionPoints",[]):
              pp=(p.get("perPlayer") or {}).get(OUR)
              if not isinstance(pp,dict): continue
              obs=pp.get("obs") or {}
              sel=obs.get("select") or {}
              options=sel.get("option") or []
              action=actions.get(p.get("seq"),{}).get("action")
              if p.get("seq") in list(actions.keys())[:16] or p.get("seq") in list(actions.keys())[-12:]:
                  points.append({"seq":p.get("seq"),"action":action,"turn":(obs.get("current") or {}).get("turn"),
                    "selectType":sel.get("type"),"context":sel.get("context"),"contextCard":sel.get("contextCard"),
                    "legalActions":pp.get("legalActions"),"options":options[:12]})
          print("MATCH_STATUS:",battle.get("status"))
          print("RESULT:",json.dumps(battle.get("result"),indent=2))
          print("TOTAL_ACTIONS:",len(battle.get("actions",[])))
          print("OUR_DECISIONS:",json.dumps(points,indent=2)[:18000])
          PY
