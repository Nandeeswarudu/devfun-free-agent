name: Inspect DevFun TCG match result

on:
  push:
    paths:
      - ".inspect-tcg-trigger"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Summarize settled practice match
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          BASE="https://arena.dev.fun/api/arena"
          MID="2950b773-c8c9-412d-9336-63ffbeb917a4"
          def get(path):
              req=urllib.request.Request(BASE+path,headers={"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      raw=r.read()
                      try: return r.status,json.loads(raw)
                      except Exception: return r.status,raw.decode("utf-8","replace")[:1200]
              except urllib.error.HTTPError as e:
                  return e.code,e.read().decode("utf-8","replace")[:800]
          st,b=get("/tcg/battle/"+MID)
          if not isinstance(b,dict):
              print("MATCH_RESPONSE:",st,str(b)[:2000]); raise SystemExit(0)
          summary={k:v for k,v in b.items() if k not in ("actions","seed")}
          summary["actionCount"]=len(b.get("actions",[])) if isinstance(b.get("actions"),list) else None
          summary["lastActions"]=b.get("actions",[])[-8:] if isinstance(b.get("actions"),list) else []
          print("MATCH_SUMMARY:",json.dumps(summary,indent=2)[:10000])
          st,d=get("/tcg/battle/"+MID+"/decisions")
          if isinstance(d,dict):
              points=d.get("decisionPoints",[])
              latest=points[-1] if points else None
              print("DECISION_SUMMARY:",json.dumps({"httpStatus":st,"status":d.get("status"),
                "decisionPointCount":len(points),"latestSeq":latest.get("seq") if isinstance(latest,dict) else None,
                "latestKeys":sorted(latest.keys()) if isinstance(latest,dict) else []},indent=2))
          PY
