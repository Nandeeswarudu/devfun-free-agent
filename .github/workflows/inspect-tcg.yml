name: Inspect DevFun TCG match status endpoints

on:
  push:
    paths:
      - ".inspect-tcg-trigger"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List authoritative TCG match routes and check settled match
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          BASE="https://arena.dev.fun/api/arena"
          CID="cmvmddsux8tt6ymnx3teo78ie"
          MID="2950b773-c8c9-412d-9336-63ffbeb917a4"
          def get(url):
              req=urllib.request.Request(url,headers={"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read()
                      try: return r.status,json.loads(raw)
                      except Exception: return r.status,raw.decode("utf-8","replace")[:1000]
              except urllib.error.HTTPError as e:
                  return e.code,e.read().decode("utf-8","replace")[:500]
              except Exception as e:
                  return 0,{"error":type(e).__name__}
          status, ih=get(BASE+"/__introspection")
          print("INTROSPECTION_STATUS:",status)
          if isinstance(ih,dict):
              paths=[{"path":e.get("path"),"method":e.get("method"),"auth":e.get("auth")}
                for e in ih.get("endpoints",[]) if any(w in e.get("path","").lower() for w in ("tcg","match","submission"))]
              print("MATCH_RELATED_ROUTES:",json.dumps(paths,indent=2)[:12000])
          for path in [
              "/tcg/matches/"+MID,
              "/tcg/match/"+MID,
              "/tcg/matches?competitionId="+CID,
              "/tcg/match?matchId="+MID,
              "/tcg/history?competitionId="+CID,
              "/matches/"+MID,
          ]:
              st,data=get(BASE+path)
              print("ROUTE_CHECK:",json.dumps({"path":path,"status":st,"data":data if not isinstance(data,(dict,list)) else data},indent=2)[:2000])
          PY
