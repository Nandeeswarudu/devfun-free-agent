name: Inspect DevFun TCG entry guide (read-only)

on:
  push:
    paths:
      - ".inspect-tcg-trigger"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify current season, rules, costs and legal deck cards
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, collections

          BASE = "https://arena.dev.fun/api/arena"
          CID = "cmvmddsux8tt6ymnx3teo78ie"
          def get(path):
              req = urllib.request.Request(BASE + path, headers={"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  return {"httpError":e.code,"path":path,"body":e.read().decode("utf-8","replace")[:1000]}

          active = get("/competition/list-active")
          print("=== ACTIVE COMPETITION EXACT MATCH ===")
          matches = [x for x in active if x.get("id")==CID] if isinstance(active,list) else []
          print(json.dumps(matches, indent=2))
          detail = get("/competition?competitionId="+CID)
          print("=== COMPETITION DETAIL (rules, execution, cost terms) ===")
          print(json.dumps(detail, indent=2)[:14000])

          introspection = get("/__introspection")
          if isinstance(introspection,dict):
              relevant = [e for e in introspection.get("endpoints",[]) if any(x in e.get("path","").lower() for x in ("tcg","submission","competition"))]
              print("=== RELEVANT API ENDPOINTS ===")
              print(json.dumps(relevant,indent=2)[:18000])

          cards = get("/tcg/cards?competitionId="+CID)
          items = cards.get("cards",cards.get("data",[])) if isinstance(cards,dict) else cards
          print("=== CARD CATALOG SUMMARY ===")
          if not isinstance(items,list):
              print(json.dumps(cards)[:2000])
              raise SystemExit(0)
          print("count:",len(items))
          print("types:",json.dumps(collections.Counter(str(c.get("cardType")) for c in items)))
          print("basic flags:",json.dumps(collections.Counter(str(c.get("basic")) for c in items)))
          def atk_summary(c):
              a=c.get("attacks",[])
              out=[]
              for x in a[:3] if isinstance(a,list) else []:
                  if isinstance(x,dict):
                      out.append({k:x.get(k) for k in ("name","damage","cost","energyCost","description") if k in x})
                  else: out.append(x)
              return out
          mons=[c for c in items if c.get("hp",0)>0]
          candidates=sorted(mons,key=lambda c:(bool(c.get("basic")),c.get("hp",0)),reverse=True)
          print("top high-HP pokemon (filtered fields):")
          print(json.dumps([{"cardId":c.get("cardId"),"name":c.get("name"),"cardType":c.get("cardType"),
                             "basic":c.get("basic"),"hp":c.get("hp"),"pokemonType":c.get("pokemonType"),
                             "energyType":c.get("energyType"),"retreatCost":c.get("retreatCost"),
                             "evolvesFrom":c.get("evolvesFrom"),"stage1":c.get("stage1"),"stage2":c.get("stage2"),
                             "ex":c.get("ex"),"aceSpec":c.get("aceSpec"),"attacks":atk_summary(c)}
                            for c in candidates[:100]],indent=2)[:20000])
          PY
