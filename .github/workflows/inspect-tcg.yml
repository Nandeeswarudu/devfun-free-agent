name: Inspect DevFun TCG match status

on:
  push:
    paths:
      - ".inspect-tcg-trigger"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read result of first practice match
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          BASE="https://arena.dev.fun/api/arena"
          MID="2950b773-c8c9-412d-9336-63ffbeb917a4"
          def get(path):
              req=urllib.request.Request(BASE+path,headers={"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      raw=r.read()
                      try: return r.status,json.loads(raw)
                      except Exception: return r.status,raw.decode("utf-8","replace")[:1200]
              except urllib.error.HTTPError as e:
                  return e.code,e.read().decode("utf-8","replace")[:800]
              except Exception as e:
                  return 0,{"error":type(e).__name__}
          ihs,ih=get("/__introspection")
          if isinstance(ih,dict):
              paths=[{"path":e.get("path"),"method":e.get("method"),"auth":e.get("auth")}
                for e in ih.get("endpoints",[]) if "/tcg/battle" in e.get("path","").lower() or "/tcg/matches" in e.get("path","").lower()]
              print("AUTHORITATIVE_MATCH_ROUTES:",json.dumps(paths,indent=2))
          for path in ["/tcg/battle/"+MID,"/tcg/battle/"+MID+"/decisions","/tcg/matches?competitionId=cmvmddsux8tt6ymnx3teo78ie"]:
              st,data=get(path)
              print("RESULT:",json.dumps({"path":path,"status":st,"data":data},indent=2)[:12000])
          PY
