name: Inspect DevFun TCG entry guide (read-only)

on:
  push:
    paths:
      - ".inspect-tcg-trigger"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect top candidate attacks and hosted-bundle API
        run: |
          python - <<'PY'
          import json, urllib.request
          BASE="https://arena.dev.fun/api/arena"
          CID="cmvmddsux8tt6ymnx3teo78ie"
          def get(path):
              req=urllib.request.Request(BASE+path,headers={"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          ih=get("/__introspection")
          print("=== ENDPOINT PATHS ===")
          print(json.dumps([{"path":e.get("path"),"method":e.get("method"),"auth":e.get("auth")}
              for e in ih.get("endpoints",[]) if any(w in e.get("path","").lower() for w in ("tcg","submission"))],indent=2))
          cards=get("/tcg/cards?competitionId="+CID)
          items=cards.get("cards",cards.get("data",[])) if isinstance(cards,dict) else cards
          fight=sorted([c for c in items if c.get("hp",0)>0 and c.get("basic") is True and c.get("energyType")==6],
                       key=lambda c:c.get("hp",0),reverse=True)
          chosen=fight[:30]
          ids=set()
          for c in chosen:
              ids.update(a for a in c.get("attacks",[]) if isinstance(a,int))
          attacks=get("/tcg/attacks?competitionId="+CID)
          if isinstance(attacks,dict):
              attacks=attacks.get("attacks",attacks.get("data",[]))
          print("=== ATTACK DETAILS FOR CANDIDATES ===")
          found=[a for a in attacks if isinstance(a,dict) and a.get("attackId") in ids] if isinstance(attacks,list) else []
          print(json.dumps(found,indent=2)[:12000])
          print("=== TOP BASIC FIGHTING CARDS + ATTACKS ===")
          amap={a.get("attackId"):a for a in found}
          print(json.dumps([{"cardId":c.get("cardId"),"name":c.get("name"),"hp":c.get("hp"),
             "retreatCost":c.get("retreatCost"),"attacks":[amap.get(i) for i in c.get("attacks",[])],
             "ex":c.get("ex")} for c in chosen[:20]],indent=2)[:18000])
          PY
