name: Check live TCG entry status

on:
  push:
    paths:
      - ".check-live-tcg-trigger"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check agent submissions and current match without making changes
        env:
          ARENA_API_KEY: ${{ secrets.ARENA_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          BASE="https://arena.dev.fun/api/arena"
          KEY=os.environ.get("ARENA_API_KEY","").strip()
          if not KEY:
              print("ERROR: Missing ARENA_API_KEY Actions secret.")
              raise SystemExit(1)
          H={"Accept":"application/json","x-arena-api-key":KEY}
          CID="cmvmddsux8tt6ymnx3teo78ie"
          def get(path):
              req=urllib.request.Request(BASE+path,headers=H)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      return r.status,json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return e.code,{"error":e.read().decode("utf-8","replace")[:500]}
          for path in ["/agent/me","/agent/submissions?competitionId="+CID+"&limit=20","/tcg/pending-actions?competitionId="+CID]:
              status,data=get(path)
              print("=== "+path+" STATUS "+str(status)+" ===")
              if path=="/agent/me" and isinstance(data,dict):
                  print(json.dumps({k:data.get(k) for k in ("id","handle","name","status") if k in data},indent=2))
              elif path.startswith("/agent/submissions") and isinstance(data,dict):
                  items=data.get("data",[])
                  safe=[]
                  for x in items:
                      if not isinstance(x,dict): continue
                      d=x.get("data") if isinstance(x.get("data"),dict) else {}
                      safe.append({"id":x.get("id"),"status":x.get("status"),"submittedAt":x.get("submittedAt"),
                          "template":d.get("template") or x.get("template"),"competitionId":d.get("competitionId") or x.get("competitionId"),
                          "matchesPlayed":x.get("matchesPlayed"),"engine":x.get("engine") if isinstance(x.get("engine"),dict) else None})
                  print(json.dumps({"total":data.get("total"),"data":safe},indent=2)[:9000])
              elif path.startswith("/tcg/pending-actions") and isinstance(data,dict):
                  pending=data.get("pending",[])
                  matches=data.get("activeMatches",[])
                  print(json.dumps({"pendingCount":len(pending) if isinstance(pending,list) else None,
                      "pending":[{"matchId":p.get("matchId"),"seq":p.get("seq"),"deadline":p.get("deadline"),
                                  "legalActionCount":len(p.get("legalActions",[]))}
                                 for p in pending if isinstance(p,dict)] if isinstance(pending,list) else [],
                      "activeMatches":matches},indent=2)[:7000])
              else:
                  print(json.dumps(data,indent=2)[:1500])
          PY
