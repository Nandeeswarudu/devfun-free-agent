name: DevFun claim-link retrieval

on:
  push:
    paths:
      - ".claim-link-trigger"

permissions:
  contents: read

jobs:
  claim-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check claim status and retrieve link
        env:
          ARENA_API_KEY: ${{ secrets.ARENA_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          key = os.environ.get("ARENA_API_KEY", "").strip()
          if not key:
              print("ERROR: Actions secret ARENA_API_KEY is missing.")
              raise SystemExit(1)

          base = "https://arena.dev.fun/api/arena"
          headers = {"Accept": "application/json", "x-arena-api-key": key}

          def request(path, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode()
              h = dict(headers)
              if data is not None:
                  h["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as res:
                      return json.loads(res.read())
              except urllib.error.HTTPError as e:
                  print("ERROR: Arena API returned HTTP", e.code, "for", path)
                  raise SystemExit(2)

          status = request("/auth/claim/status")
          if status.get("claimed"):
              print("Agent already claimed. No new claim token was created.")
              if status.get("xHandle"):
                  print("Verified X handle:", status["xHandle"])
              raise SystemExit(0)

          result = status if status.get("claimUrl") else request("/auth/claim/init", "POST", {})
          url = result.get("claimUrl")
          if not url:
              print("Claim URL was not returned. Safe response fields:")
              print(json.dumps({k:v for k,v in result.items() if k not in ("claimToken","token","apiKey","secret")}, indent=2))
              raise SystemExit(3)

          print("CLAIM LINK (open this URL and complete wallet + X verification):")
          print(url)
          print("Do not share this link publicly.")
          PY
