name: DevFun claim-link retrieval (encrypted output)

on:
  push:
    paths:
      - ".claim-link-trigger"

permissions:
  contents: read

jobs:
  claim-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check claim status and return encrypted result only
        shell: bash
        env:
          ARENA_API_KEY: ${{ secrets.ARENA_API_KEY }}
        run: |
          set -euo pipefail
          cat > /tmp/claim-link-public.pem <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEArW5aB06cAYULK3sNzEeB
          rLMUV2BvQhyvxQQmv8tQnEaRyL3Or/maM1+0NGJxJ9T0pPikanoFBSrBgokvurOG
          2qv2RLmvJYOD9IEH1FZ3Exsk4ysjke8YO/0RMOVJjLye+PpcPCV/HzVp77BckhrB
          reUaR4wkuxjMhKQRGWlqN7BzIDw92ZQxH2G4UQ2QVgJ/4oLw/IjXbTX86+CgjIKt
          A4tg5oXC25oldLyhrKtH3/Vt9p8ercjQR6DnNexcPoU7uMRcytYSoGyQnJFoPzh9
          pXc79EdLKvGuQMfOd79IngZ6ILHQrT0NkOAaQZ9oyx1AhNmnRyYNtoHh/2pgTcrs
          L5LB8/EethbS0LoczyvLW8njj3sixpbztMvI7DEzMFQ4x0OiqTJxY4i4J54EQ5XX
          YBsxhXT20BoI6gnTe+e60c1QHH65wXS3zG6fKW+w1noZcsYdpAx7lkFSN3tdb1Pa
          O7OYRKY28OP4BW5LkH0dc8DFfI9YV0CMWXXl+m4y6l7xAgMBAAE=
          -----END PUBLIC KEY-----
          PUBKEY

          python - <<'PY'
          import base64, json, os, subprocess, tempfile, urllib.error, urllib.request

          api_key = os.environ.get("ARENA_API_KEY", "")
          if not api_key:
              print("ERROR: Missing repository Actions secret ARENA_API_KEY. No request was made.")
              raise SystemExit(10)

          base = "https://arena.dev.fun/api/arena"
          headers = {"Accept": "application/json", "x-arena-api-key": api_key}

          def call(path, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode()
              h = dict(headers)
              if data is not None:
                  h["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.loads(response.read())
              except urllib.error.HTTPError as e:
                  # Never log response bodies: they can contain claim credentials.
                  print(json.dumps({"error": True, "http_status": e.code, "endpoint": path}))
                  raise SystemExit(11)
              except Exception:
                  print(json.dumps({"error": True, "endpoint": path, "message": "Network or response error; details suppressed"}))
                  raise SystemExit(12)

          state = call("/auth/claim/status")
          if state.get("claimed"):
              result = {
                  "claimed": True,
                  "xHandle": state.get("xHandle"),
                  "message": "This agent is already claimed; no new claim token was issued."
              }
          elif state.get("hasClaimToken") and state.get("claimUrl"):
              result = state
          else:
              result = call("/auth/claim/init", method="POST", body={})

          # Encrypt the response before writing it to public Actions logs.
          raw = json.dumps(result, separators=(",", ":")).encode()
          aes_key = os.urandom(32)
          iv = os.urandom(16)
          with tempfile.TemporaryDirectory() as td:
              plain = os.path.join(td, "result.json")
              cipher = os.path.join(td, "result.enc")
              keyiv = os.path.join(td, "keyiv.txt")
              wrapped = os.path.join(td, "keyiv.enc")
              with open(plain, "wb") as f:
                  f.write(raw)
              with open(keyiv, "w") as f:
                  f.write(aes_key.hex() + "\n" + iv.hex() + "\n")
              subprocess.run(
                  ["openssl", "enc", "-aes-256-cbc", "-K", aes_key.hex(), "-iv", iv.hex(),
                   "-in", plain, "-out", cipher],
                  check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
              )
              subprocess.run(
                  ["openssl", "pkeyutl", "-encrypt", "-pubin", "-inkey", "/tmp/claim-link-public.pem",
                   "-in", keyiv, "-out", wrapped, "-pkeyopt", "rsa_padding_mode:oaep",
                   "-pkeyopt", "rsa_oaep_md:sha256"],
                  check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
              )
              bundle = {
                  "version": 1,
                  "encrypted_key_iv_b64": base64.b64encode(open(wrapped, "rb").read()).decode(),
                  "ciphertext_b64": base64.b64encode(open(cipher, "rb").read()).decode()
              }
          print("ENCRYPTED_CLAIM_RESULT_BEGIN")
          print(json.dumps(bundle, separators=(",", ":")))
          print("ENCRYPTED_CLAIM_RESULT_END")
          PY
