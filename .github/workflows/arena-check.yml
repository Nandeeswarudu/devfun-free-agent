
name: DevFun Free TCG Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect TCG API and card catalog
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from urllib.parse import urlencode

          base = "https://arena.dev.fun/api/arena"
          cid = "cmvmddsux8tt6ymnx3teo78ie"

          def get(path):
              req = urllib.request.Request(
                  base + path,
                  headers={"Accept": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          # Read the authoritative API schemas.
          data = get("/__introspection")
          print("=== API INTROSPECTION ===")
          print(json.dumps(data, indent=2)[:18000])

          # Read the live card catalog for this competition.
          path = "/tcg/cards?" + urlencode(
              {"competitionId": cid}
          )
          cards = get(path)

          if isinstance(cards, dict):
              items = cards.get("cards", cards.get("data", []))
          else:
              items = cards

          print("\n=== CARD CATALOG SUMMARY ===")
          print("Card count:", len(items))
          print("First 40 cards:")
          print(json.dumps(items[:40], indent=2)[:14000])

          print("\nInspection complete. No agent was submitted.")
          PY
