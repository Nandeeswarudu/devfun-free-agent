name: One-time DevFun agent registration

on:
  push:
    paths:
      - ".register-agent"

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Register once and encrypt the response
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/devfun-public.pem <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA2C4WPYUGoMepW+hluD2u
          AiYr/85zO9EOv4ZLa1OdQdfhk4wDWp1G6zgxLV1vwKqfB/rqun8BXzpv03tEvEIJ
          7g26T5FWPnKo0jVUj0+rZmkBiywRnYnzsMAQJZlscW8wdkhSCN2VSfFG0E1GU4U4
          WY6NisIp7HU9KKYwGuFkb3rwKxxuCEzq/9roH7h/dpXEnzAcgDvj+trjwZ1paiwb
          qRP80DxeWhXbSqApi6lW1cpAplBQ9iEn0Ldli6K0e08jdF7vvXwC5egk8DsB67HK
          ahn+R4tXwAQ3bGksk8NE03VmhhTk9hAJyW69/QKCHNe0opUS+g7v4vjN0RwiSSpG
          An5/ogjbKPpIsqtKT2kg0/xq+ccGmeUeKSq7YIm+YYpARe4+TsNFuvHeJ3k/qZdr
          eNyXOjIsGkVab/XTvhcTeD8El64VQW6Rw2GLebnXXXwBtNRZDKPfEp+SqzwqqMkQ
          aT3QWUEZaho0nPe0EMbJ5xU+c9/ICZvIsWVKazdcF3czAgMBAAE=
          -----END PUBLIC KEY-----
          PUBKEY

          python - <<'PY'
          import base64, json, os, secrets, subprocess, tempfile, urllib.error, urllib.request

          url = "https://arena.dev.fun/api/arena/auth/register"
          payload = {"handle": "Nandu", "name": "Nandu AI", "quote": "Smart bot."}
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              headers={"Accept": "application/json", "Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = response.read()
          except urllib.error.HTTPError as exc:
              # Never log a response that could contain an API credential.
              body = exc.read()
              try:
                  obj = json.loads(body)
                  safe = {k: v for k, v in obj.items() if k not in ("apiKey", "token", "secret", "claimToken")}
              except Exception:
                  safe = {"message": "Registration endpoint returned an HTTP error."}
              print(json.dumps({"registration": "failed", "http_status": exc.code, "details": safe}))
              raise SystemExit(2)

          data = json.loads(result)
          if not isinstance(data, dict) or not data.get("apiKey"):
              safe = {k: v for k, v in data.items() if k not in ("apiKey", "token", "secret", "claimToken")} if isinstance(data, dict) else {"message": "Unexpected response format"}
              print(json.dumps({"registration": "failed", "details": safe}))
              raise SystemExit(3)

          # Hybrid encryption: AES-256-CBC encrypts the full response, RSA-OAEP
          # encrypts the random AES key and IV. Only ciphertext is written to logs.
          key = secrets.token_bytes(32)
          iv = secrets.token_bytes(16)
          with tempfile.TemporaryDirectory() as tmp:
              plain = os.path.join(tmp, "response.json")
              cipher = os.path.join(tmp, "response.enc")
              wrapped = os.path.join(tmp, "keyiv.enc")
              with open(plain, "wb") as f:
                  f.write(result)
              subprocess.run(
                  ["openssl", "enc", "-aes-256-cbc", "-K", key.hex(), "-iv", iv.hex(), "-in", plain, "-out", cipher],
                  check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              )
              with open(os.path.join(tmp, "keyiv.txt"), "w") as f:
                  f.write(key.hex() + "\\n" + iv.hex())
              subprocess.run(
                  ["openssl", "pkeyutl", "-encrypt", "-pubin", "-inkey", "/tmp/devfun-public.pem",
                   "-in", os.path.join(tmp, "keyiv.txt"), "-out", wrapped,
                   "-pkeyopt", "rsa_padding_mode:oaep", "-pkeyopt", "rsa_oaep_md:sha256"],
                  check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              )
              bundle = {
                  "version": 1,
                  "encrypted_key_iv_b64": base64.b64encode(open(wrapped, "rb").read()).decode(),
                  "ciphertext_b64": base64.b64encode(open(cipher, "rb").read()).decode(),
              }
          print("ENCRYPTED_REGISTRATION_RESULT_BEGIN")
          print(json.dumps(bundle, separators=(",", ":")))
          print("ENCRYPTED_REGISTRATION_RESULT_END")
          PY
